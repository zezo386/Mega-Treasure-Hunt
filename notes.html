<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Players notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="notes.css">
</head>
<body>
    <div class="overlay" id="nameForm">
        <div class="nameForm">
          <input type="text" placeholder="Enter your name: " class="nameInput" id="nameInput">
          <div class="msg" id="msg"></div>
          <button onclick="confirmUsername()">Confirm name</button>
        </div>
    </div>
    <div class="overlay hidden" id="main2">
        <div class="Container">
            <h1>Players notes</h1>
            <textarea class="noteInput"></textarea>
        </div>
    </div>
    <script src="notes.js"></script>
</body>
</html>
